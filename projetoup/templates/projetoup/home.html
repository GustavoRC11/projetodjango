{% extends 'projetoup/_base.html' %}


{% block content %}

<h2>Posts recentes</h2>
<p>{{ total }} posts.</p>

<div class="posts-grid">

    {% for post in posts %}

    <article class="post-card">

        <img src="{{ post.thumbnail }}" alt="{{ post.title }}">

        <div class="post-card-content">
            <h4>
                <a href="{% url 'post_view' id=post.id %}">
                    {{ post.title }}
                </a>
            </h4>

            <p>{{ post.summary }}</p>
        </div>

    </article>

    {% empty %}

    <p>Não achei nada.</p>

    {% endfor %}

</div>

{% endblock %}
